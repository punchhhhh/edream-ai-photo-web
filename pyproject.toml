[project]
name = "edream-ai-photo-web"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# 对象存储后端(STORAGE_BACKEND=cos)需要
cos = ["cos-python-sdk-v5>=1.9"]

[tool.setuptools]
packages = ["backend", "backend.routers", "backend.services"]
